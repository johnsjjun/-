<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>오늘의 운세</title>
<meta name="theme-color" content="#1a1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 운세">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg-0:#120b25;
    --bg-1:#1d1240;
    --bg-2:#2a1a55;
    --card:#241848;
    --card-2:#2e1f5c;
    --gold:#f4c968;
    --gold-soft:#f4c96833;
    --text-0:#f5f2ff;
    --text-1:#c9c0e8;
    --text-2:#8f84b8;
    --accent:#ff7ab8;
    --accent-2:#7ad9ff;
    --danger:#ff8a8a;
    --success:#8affc1;
    --radius:20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(circle at 20% 0%, #3a2570 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #4b2a63 0%, transparent 40%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    color:var(--text-0);
    min-height:100%;
    overflow-x:hidden;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 80% 15%, #fff 100%, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff 100%, transparent),
      radial-gradient(1px 1px at 65% 45%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 25% 85%, #fff 100%, transparent),
      radial-gradient(1px 1px at 90% 80%, #fff 100%, transparent),
      radial-gradient(1px 1px at 55% 10%, #fff 100%, transparent);
  }
  .wrap{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 32px);}

  header.top{ text-align:center; margin-bottom:18px; }
  header.top .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; letter-spacing:.08em; color:var(--gold);
    background:var(--gold-soft); border:1px solid #f4c96855;
    padding:5px 12px; border-radius:999px; margin-bottom:10px;
  }
  header.top h1{ font-size:24px; margin:6px 0 4px; font-weight:800; letter-spacing:-.02em;}
  header.top .date{ color:var(--text-1); font-size:14px; margin:0; }
  header.top .ilju{
    margin-top:12px; display:inline-block; font-size:14px; color:var(--text-0);
    background:linear-gradient(135deg,var(--card-2),var(--card));
    border:1px solid #ffffff17; padding:8px 18px; border-radius:14px;
    box-shadow:0 8px 24px -12px #00000080;
  }
  header.top .ilju b{ color:var(--gold); font-size:16px; }

  .tabbar{
    display:flex; gap:6px; overflow-x:auto; padding:4px 2px 14px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{
    flex:0 0 auto; font-size:13px; font-weight:600; color:var(--text-1);
    background:#ffffff0d; border:1px solid #ffffff14; padding:8px 14px;
    border-radius:999px; white-space:nowrap; cursor:pointer; transition:all .15s ease;
  }
  .tabbtn.active{ background:linear-gradient(135deg,var(--accent),#c084fc); color:#1a0f33; border-color:transparent; font-weight:800; }

  .cards{ display:flex; flex-direction:column; gap:14px; }
  .card{
    background:linear-gradient(160deg, var(--card-2), var(--card) 60%);
    border:1px solid #ffffff14;
    border-radius:var(--radius);
    padding:18px 18px 16px;
    box-shadow:0 14px 40px -20px #00000090;
    scroll-margin-top:12px;
  }
  .card .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .card .tti{ font-size:19px; font-weight:800; }
  .card .starname{ font-size:12.5px; color:var(--gold); background:#f4c96820; border:1px solid #f4c96840; padding:4px 10px; border-radius:999px; font-weight:700; white-space:nowrap;}
  .power{ font-size:13px; color:var(--accent-2); margin:0 0 8px; font-weight:700; letter-spacing:.02em;}
  .summary{ font-size:14.5px; color:var(--text-0); margin:0 0 14px; line-height:1.5; font-weight:600;}

  .row{ display:flex; gap:10px; font-size:13.5px; line-height:1.5; margin-bottom:8px; }
  .row .ico{ flex:0 0 22px; text-align:center; }
  .row .lbl{ flex:0 0 46px; color:var(--text-2); font-weight:700; font-size:12.5px; padding-top:1px;}
  .row .val{ flex:1; color:var(--text-1); }

  .special{
    margin:10px 0; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.5;
    background:#ffffff0a; border:1px dashed #ffffff2a; color:var(--text-0);
  }

  .meta{ display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap;}
  .chip{ font-size:12px; color:var(--text-1); background:#ffffff0d; padding:6px 10px; border-radius:10px; border:1px solid #ffffff14;}
  .chip b{ color:var(--text-0); }

  .caution{ font-size:12.5px; color:var(--danger); background:#ff8a8a14; border:1px solid #ff8a8a30; padding:8px 10px; border-radius:10px; margin-top:6px;}

  details.years{ margin-top:14px; }
  details.years summary{
    cursor:pointer; list-style:none; font-size:13px; font-weight:700; color:var(--text-0);
    display:flex; align-items:center; justify-content:space-between;
    background:#ffffff0d; padding:10px 12px; border-radius:12px; border:1px solid #ffffff14;
  }
  details.years summary::-webkit-details-marker{ display:none; }
  details.years summary::after{ content:'▾'; color:var(--text-2); transition:transform .2s ease; }
  details.years[open] summary::after{ transform:rotate(180deg); }
  .yearlist{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .yearline{
    font-size:13px; color:var(--text-1); background:#ffffff08; padding:8px 10px; border-radius:10px;
    display:flex; gap:8px; line-height:1.45;
  }
  .yearline .yy{ flex:0 0 auto; color:var(--gold); font-weight:800; font-size:12.5px;}
  .yearline.highlight{ background:linear-gradient(135deg,#7ad9ff18,#ff7ab818); border:1px solid #ffffff20;}

  .find-me{
    margin:2px 0 20px; padding:14px; border-radius:16px;
    background:linear-gradient(135deg,#241848,#1a1033);
    border:1px solid #ffffff1a;
  }
  .find-me .ttl{ font-size:13px; color:var(--text-2); margin-bottom:8px; font-weight:700;}
  .find-me select{
    width:100%; padding:12px 12px; font-size:15px; border-radius:12px;
    background:#ffffff0f; color:var(--text-0); border:1px solid #ffffff22;
    appearance:none; -webkit-appearance:none;
  }

  footer.foot{ text-align:center; color:var(--text-2); font-size:12px; margin-top:6px; line-height:1.6; }
  footer.foot .heart{ color:var(--accent); }

  .fab{
    position:fixed; right:18px; bottom:calc(var(--safe-bottom) + 18px); z-index:5;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#c084fc); color:#1a0f33;
    font-size:20px; box-shadow:0 10px 30px -8px #ff7ab880; display:flex; align-items:center; justify-content:center;
  }

  ::selection{ background:#ff7ab850; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

  <header class="top">
    <span class="eyebrow">✨ 당사주 기반 운세</span>
    <h1>오늘의 운세</h1>
    <p class="date" id="dateLine">불러오는 중...</p>
    <div class="ilju">오늘의 일진 &nbsp;<b id="iljuBranch">-</b>일</div>
  </header>

  <div class="find-me">
    <div class="ttl">🔍 내 띠 빠르게 찾기</div>
    <select id="jumpSelect"></select>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <main class="cards" id="cards"></main>

  <footer class="foot">
    오늘도 기분 좋은 일들만 가득하시길 바랍니다 <span class="heart">💜</span><br>
    ※ 어디까지나 당사주 기반 운세이니, 그냥 재미로만 보세요! 😜
  </footer>
</div>

<button class="fab" id="scrollTop" title="맨 위로">↑</button>

<script src="data.js"></script>
<script src="advice.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
